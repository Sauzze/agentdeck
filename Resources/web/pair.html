<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="AgentDeck">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Pair AgentDeck</title>
<style>
  :root { --body: #0e0e0e; --cap: #1f1f1f; --edge: #2c2c2c; --ink: #ececec; --dim: #8a8a8a; --accent: #3b82f6; --error: #ef4444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--body); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  main { max-width: 380px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 48px) 24px 32px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 24px; margin: 20px 0 8px; }
  p { color: var(--dim); margin: 0 0 28px; }
  input { width: 100%; font: 600 34px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .35em; text-align: center;
    padding: 16px 0 16px .35em; background: var(--cap); color: var(--ink); border: 1px solid var(--edge); border-radius: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 14px; padding: 15px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
    font: 600 17px -apple-system, BlinkMacSystemFont, sans-serif; }
  button:disabled { opacity: .4; }
  .error { color: var(--error); min-height: 22px; margin-top: 14px; font-size: 14px; }
  .help { margin-top: 36px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="">
  <h1>Pair with your Mac</h1>
  <p>On your Mac, click the AgentDeck icon in the menu bar, choose <b>Pair a Phone…</b>, and enter the code it shows.</p>
  <form id="form">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Pairing code">
    <button id="go" disabled>Pair</button>
  </form>
  <div class="error" id="error" role="alert"></div>
  <div class="help">Codes last five minutes and work once.</div>
</main>
<script>
  const code = document.getElementById('code');
  const go = document.getElementById('go');
  const error = document.getElementById('error');

  code.addEventListener('input', () => {
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
    go.disabled = code.value.length !== 6;
    error.textContent = '';
  });

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true;
    try {
      const res = await fetch('/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.value }) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error);
      // The token goes in the deck's URL, so Add to Home Screen keeps it.
      location.replace(`/?t=${encodeURIComponent(body.token)}`);
    } catch (err) {
      error.textContent = err.message || 'Could not reach your Mac. Are you on the same Wi-Fi?';
      code.value = '';
      code.focus();
    }
  });

  code.focus();
</script>
</body>
</html>
